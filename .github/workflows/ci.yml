name: conformance

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch regressions introduced by a dependency

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm with the committed lockfile: the numbers in docs/ must be
      # reproducible, which means the dependency tree must be pinned.
      - run: pnpm install --frozen-lockfile

      - name: Unit tests (classifier, adjudication, capability observer, RTL)
        run: pnpm test

      - name: Conformance matrix (default fonts)
        run: node src/cli.js --md | tee results.md

      - name: Conformance matrix (system Unicode font, if present)
        run: |
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          if [ -f "$FONT" ]; then
            node src/cli.js --font "$FONT" --md | tee results-font.md
          else
            echo "no system font found, skipping the font pass"
          fi

      # The packaging is part of the product: a bin that cannot be installed is a
      # broken release. Install the packed tarball in a clean dir and run it there.
      - name: Packaging smoke test
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/canipdf-*.tgz
          npx canipdf --md | head -20
          npx canipdf --fail-on DISPUTED > /dev/null || echo "gate exit (expected 1): $?"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: canipdf-results
          path: |
            results.json
            results.md
            results-font.md
